# Least-Privilege RBAC Example for CIS
# Scope: Only watched namespaces; cluster-scope kept minimal.
# Replace: WATCHED_NAMESPACE_1, WATCHED_NAMESPACE_2 with real namespaces.
# Optional sections are marked. Remove what you do not need.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bigip-ctlr
  namespace: kube-system
---
# ClusterRole: only unavoidable cluster-scoped reads (optional pieces annotated)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bigip-ctlr-cluster-min
rules:
  # Needed if controller discovers nodes for address resolution / tunnel members
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get","list","watch"]
  # Needed only if using namespace label selector / dynamic namespace discovery
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get","list","watch"]
  # Calico static route (blockaffinities) support (optional)
  - apiGroups: ["crd.projectcalico.org"]
    resources: ["blockaffinities"]
    verbs: ["get","list","watch"]
  # OpenShift cluster network CIDR detection (optional / OpenShift only)
  - apiGroups: ["config.openshift.io/v1"]
    resources: ["network"]
    verbs: ["list"]
  # If you need to verify CRD presence (usually not required at runtime) keep read-only
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bigip-ctlr-cluster-min-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bigip-ctlr-cluster-min
subjects:
  - kind: ServiceAccount
    name: bigip-ctlr
    namespace: kube-system
---
# Repeat Role + RoleBinding per watched namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bigip-ctlr-ns
  namespace: WATCHED_NAMESPACE_1
rules:
  - apiGroups: [""]
    resources: ["services","services/status","endpoints","pods"]
    verbs: ["get","list","watch","update"]  # update only needed for services/status
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get","list","watch","update"]  # controller updates existing ConfigMaps
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","watch"]             # restrict to specific namespaces only
  - apiGroups: ["networking.k8s.io","extensions"]
    resources: ["ingresses","ingresses/status"]
    verbs: ["get","list","watch","update"]    # update required for status
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get","list","watch"]
  - apiGroups: ["cis.f5.com"]
    resources: ["virtualservers","virtualservers/status","transportservers","transportservers/status","ingresslinks","ingresslinks/status","tlsprofiles","externaldnses","policies"]
    verbs: ["get","list","watch","patch","update"]  # patch/update for status & spec adjustments
  - apiGroups: ["fic.f5.com"]
    resources: ["ipams","ipams/status"]
    verbs: ["get","list","watch"]  # no mutations observed; add update if future status writes required
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bigip-ctlr-ns-binding
  namespace: WATCHED_NAMESPACE_1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bigip-ctlr-ns
subjects:
  - kind: ServiceAccount
    name: bigip-ctlr
    namespace: kube-system
---
# Copy below block for each additional watched namespace, changing namespace value
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bigip-ctlr-ns
  namespace: WATCHED_NAMESPACE_2
rules:
  - apiGroups: [""]
    resources: ["services","services/status","endpoints","pods"]
    verbs: ["get","list","watch","update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get","list","watch","update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["networking.k8s.io","extensions"]
    resources: ["ingresses","ingresses/status"]
    verbs: ["get","list","watch","update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get","list","watch"]
  - apiGroups: ["cis.f5.com"]
    resources: ["virtualservers","virtualservers/status","transportservers","transportservers/status","ingresslinks","ingresslinks/status","tlsprofiles","externaldnses","policies"]
    verbs: ["get","list","watch","patch","update"]
  - apiGroups: ["fic.f5.com"]
    resources: ["ipams","ipams/status"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bigip-ctlr-ns-binding
  namespace: WATCHED_NAMESPACE_2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bigip-ctlr-ns
subjects:
  - kind: ServiceAccount
    name: bigip-ctlr
    namespace: kube-system

# NOTES:
# 1. Remove any optional cluster-scope rule sections not needed in your deployment.
# 2. If controller does NOT update ingress/service status in your setup, drop "update" on ingresses/status and services/status.
# 3. If you later observe ipam status writes, add "update" for ipams/status.
# 4. Secrets access is confined to only these namespaces; avoid granting cluster-wide secret access.
# 5. For further tightening, enumerate specific secret names via external secret management rather than broad namespace reads.

